[project]
name = "change-checkpoint-randomly"
description = "A custom node for ComfyUI that enables automatic checkpoint rotation during batch image generation. This allows you to generate images using multiple different model checkpoints in a single workflow, automatically switching between them based on your specified interval."
version = "1.0.0"
license = {file = "LICENSE"} 
